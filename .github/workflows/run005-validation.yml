name: RUN 005 validation

on:
  push:
    branches:
      - feature/workspace-run-005

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout RUN 005
        uses: actions/checkout@v4
        with:
          ref: feature/workspace-run-005
          fetch-depth: 0

      - name: Configure Node and Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Report runtime versions
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          echo "Node: $(node --version)"
          echo "Yarn: $(yarn --version)"

      - name: Verify migrations 001 through 003 immutable
        run: |
          migration001="$(git hash-object workspace-server/migrations/001_repository_foundation.sql)"
          migration002="$(git hash-object workspace-server/migrations/002_canonical_domain.sql)"
          migration003="$(git hash-object workspace-server/migrations/003_art_variants_asset_index.sql)"
          echo "migration001 blob: $migration001"
          echo "migration002 blob: $migration002"
          echo "migration003 blob: $migration003"
          test "$migration001" = "146b395716c51b0a8a8861876e4df2d47a05fd4d"
          test "$migration002" = "253fe76054ce3f40d50d09ecd3e90bb1b322deea"
          test "$migration003" = "7f1aa54649a4b4b73871a50177de492047fe4f83"

      - name: Verify Workspace lockfile unchanged from RUN 004
        run: git diff --exit-code 81c20eb1477e1a0151b6e590d1e31390d82c6de4 -- workspace-server/yarn.lock

      - name: Install root dependencies frozen
        run: yarn install --frozen-lockfile

      - name: Compile existing Carder
        run: yarn compile

      - name: Build existing Carder
        run: yarn build

      - name: Install Workspace Service frozen
        working-directory: workspace-server
        run: yarn install --frozen-lockfile

      - name: Verify jpeg-js remains pinned
        working-directory: workspace-server
        run: |
          node -e "const p=require('./node_modules/jpeg-js/package.json'); if(p.version!=='0.4.4') process.exit(1); console.log('jpeg-js',p.version)"
          yarn list --pattern jpeg-js --depth=0

      - name: Compile Workspace Service
        working-directory: workspace-server
        run: yarn compile

      - name: Test Workspace Service
        working-directory: workspace-server
        run: yarn test

      - name: Verify repository hygiene
        run: |
          git status --short
          git diff --exit-code
          if git status --porcelain --untracked-files=all | grep -E '\.(db|db-wal|db-shm|db-journal)$'; then
            echo "Unexpected persistence artifact found"
            exit 1
          fi
          if git status --porcelain --untracked-files=all | grep -E 'Assets/Managed|Temp/ManagedIngest'; then
            echo "Unexpected managed runtime artifact found"
            exit 1
          fi

      - name: Remove temporary RUN 005 validation workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/run005-validation.yml
          git add .github/workflows/run005-validation.yml
          git commit -m "chore(validation): finalize RUN 005 validation"
          git push origin HEAD:feature/workspace-run-005
