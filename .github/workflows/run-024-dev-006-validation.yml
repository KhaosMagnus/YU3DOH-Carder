name: RUN 024 DEV-006 candidate validation

on:
  push:
    branches:
      - ops/run-024-dev-006-actions
    paths:
      - '.github/workflows/run-024-dev-006-validation.yml'
      - 'validation/dev006-**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CANDIDATE_ROOT: ${{ github.workspace }}/run-024
      DEV006_OUTPUT: ${{ github.workspace }}/dev006-evidence
      DEV006_WORKSPACE: ${{ github.workspace }}/dev006-workspace
      NODE_PATH: ${{ github.workspace }}/dev006-tools/node_modules
    steps:
      - name: Checkout operational harness
        uses: actions/checkout@v4
        with:
          path: ops-control
      - name: Checkout exact RUN 024 target
        uses: actions/checkout@v4
        with:
          ref: e07140d5a9555a17b7b2306a45625c14adfafc8e
          fetch-depth: 0
          path: run-024
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install Yarn
        run: npm install --global yarn@1.22.22
      - name: Create evidence directory
        run: mkdir -p "$DEV006_OUTPUT"
      - name: Exact custody before execution
        run: node ops-control/validation/dev006-custody.cjs preflight
      - name: install-root
        id: install_root
        continue-on-error: true
        run: node ops-control/validation/dev006-command.cjs install-root yarn install --frozen-lockfile --non-interactive
      - name: install-service
        id: install_service
        continue-on-error: true
        run: node ops-control/validation/dev006-command.cjs install-service yarn --cwd workspace-server install --frozen-lockfile --non-interactive
      - name: compile
        id: compile
        continue-on-error: true
        run: node ops-control/validation/dev006-command.cjs compile yarn compile
      - name: build
        id: build
        continue-on-error: true
        run: node ops-control/validation/dev006-command.cjs build yarn build
      - name: test-sc
        id: test_sc
        continue-on-error: true
        run: node ops-control/validation/dev006-command.cjs test-sc yarn test:sc
      - name: test-library
        id: test_library
        continue-on-error: true
        run: node ops-control/validation/dev006-command.cjs test-library yarn test:library
      - name: compile-service
        id: compile_service
        continue-on-error: true
        run: node ops-control/validation/dev006-command.cjs compile-service yarn --cwd workspace-server compile
      - name: test-service
        id: test_service
        continue-on-error: true
        run: node ops-control/validation/dev006-command.cjs test-service yarn --cwd workspace-server test
      - name: Install isolated Chromium tooling
        run: |
          npm install --prefix "$GITHUB_WORKSPACE/dev006-tools" --no-audit --no-fund playwright-core@1.58.2
          node "$GITHUB_WORKSPACE/dev006-tools/node_modules/playwright-core/cli.js" install --with-deps chromium
      - name: Execute T1-OP-01 through T1-OP-07
        run: node ops-control/validation/dev006-browser.cjs
      - name: Final custody
        if: always()
        run: node ops-control/validation/dev006-custody.cjs final
      - name: Evaluate full gate
        if: always()
        run: |
          node - <<'JS'
          const fs=require('node:fs'),path=require('node:path');
          const out=process.env.DEV006_OUTPUT;
          const names=['install-root','install-service','compile','build','test-sc','test-library','compile-service','test-service'];
          const results=names.map(n=>{try{return {name:n,...JSON.parse(fs.readFileSync(path.join(out,n+'.json'),'utf8'))}}catch{return {name:n,missing:true}}});
          const ready=results.every(r=>r.exitCode===0)&&JSON.parse(fs.readFileSync(path.join(out,'final-status.json'),'utf8')).status==='READY FOR EXTERNAL QA';
          fs.writeFileSync(path.join(out,'gate-results.json'),JSON.stringify({status:ready?'READY FOR EXTERNAL QA':'IMPLEMENTATION BLOCKED',results},null,2));
          if(!ready)process.exitCode=1;
          JS
      - name: Hash evidence
        if: always()
        run: |
          cd "$DEV006_OUTPUT"
          find . -type f ! -name manifest.sha256 -print0 | sort -z | xargs -0 sha256sum > manifest.sha256
          cat manifest.sha256
      - name: Preserve DEV-006 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev006-readiness-${{ github.run_id }}-e07140d5a9555a17b7b2306a45625c14adfafc8e
          path: ${{ github.workspace }}/dev006-evidence
          if-no-files-found: error
          retention-days: 90
