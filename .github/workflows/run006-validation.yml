name: RUN 006 validation

on:
  push:
    branches:
      - feature/workspace-run-006

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout RUN 006
        uses: actions/checkout@v4
        with:
          ref: feature/workspace-run-006
          fetch-depth: 0

      - name: Configure Node and Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Report runtime versions
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          echo "Node: $(node --version)"
          echo "Yarn: $(yarn --version)"

      - name: Verify migrations 001 through 004 immutable
        run: |
          test "$(git hash-object workspace-server/migrations/001_repository_foundation.sql)" = "146b395716c51b0a8a8861876e4df2d47a05fd4d"
          test "$(git hash-object workspace-server/migrations/002_canonical_domain.sql)" = "253fe76054ce3f40d50d09ecd3e90bb1b322deea"
          test "$(git hash-object workspace-server/migrations/003_art_variants_asset_index.sql)" = "7f1aa54649a4b4b73871a50177de492047fe4f83"
          test "$(git hash-object workspace-server/migrations/004_managed_asset_ingest.sql)" = "2f2f58239d597d34d5608fcf022b9d2f4007da91"

      - name: Verify dependency lockfiles unchanged from RUN 005
        run: |
          git diff --exit-code 94c4fed2c114a8d5b38626b48722237d9ec8263d -- yarn.lock
          git diff --exit-code 94c4fed2c114a8d5b38626b48722237d9ec8263d -- workspace-server/yarn.lock

      - name: Install root dependencies frozen
        run: yarn install --frozen-lockfile

      - name: Compile Carder and Library client
        run: yarn compile

      - name: Validate Library client contract
        run: yarn test:library

      - name: Build Carder and Library production entries
        run: yarn build

      - name: Verify production entry outputs
        run: |
          test -f dist/index.html
          test -f dist/library/index.html
          grep -q "YU3DOH Library" dist/library/index.html

      - name: Install Workspace Service frozen
        working-directory: workspace-server
        run: yarn install --frozen-lockfile

      - name: Verify existing jpeg-js pin
        working-directory: workspace-server
        run: |
          node -e "const p=require('./node_modules/jpeg-js/package.json'); if(p.version!=='0.4.4') process.exit(1); console.log('jpeg-js',p.version)"
          yarn list --pattern jpeg-js --depth=0

      - name: Compile Workspace Service
        working-directory: workspace-server
        run: yarn compile

      - name: Test Workspace Service
        working-directory: workspace-server
        run: yarn test

      - name: Verify repository hygiene
        run: |
          git status --short
          git diff --exit-code
          if git status --porcelain --untracked-files=all | grep -E '\.(db|db-wal|db-shm|db-journal)$'; then
            exit 1
          fi

      - name: Remove temporary RUN 006 validation workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/run006-validation.yml
          git add .github/workflows/run006-validation.yml
          git commit -m "chore(validation): finalize RUN 006 validation"
          git push origin HEAD:feature/workspace-run-006
