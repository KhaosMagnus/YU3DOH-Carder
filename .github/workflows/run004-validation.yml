name: RUN 004 validation

on:
  push:
    branches:
      - feature/workspace-run-004

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout RUN 004
        uses: actions/checkout@v4
        with:
          ref: feature/workspace-run-004
          fetch-depth: 0

      - name: Configure Node and Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Report runtime versions
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          echo "Node: $(node --version)"
          echo "Yarn: $(yarn --version)"

      - name: Verify migrations 001 and 002 immutable
        run: |
          migration001="$(git hash-object workspace-server/migrations/001_repository_foundation.sql)"
          migration002="$(git hash-object workspace-server/migrations/002_canonical_domain.sql)"
          echo "migration001 blob: $migration001"
          echo "migration002 blob: $migration002"
          test "$migration001" = "146b395716c51b0a8a8861876e4df2d47a05fd4d"
          test "$migration002" = "253fe76054ce3f40d50d09ecd3e90bb1b322deea"

      - name: Verify Workspace lockfile unchanged from RUN 003
        run: git diff --exit-code 017c904c22c7842fa1209e3e39885453dda1e63a -- workspace-server/yarn.lock

      - name: Install root dependencies frozen
        run: yarn install --frozen-lockfile

      - name: Compile existing Carder
        run: yarn compile

      - name: Build existing Carder
        run: yarn build

      - name: Install Workspace Service frozen
        working-directory: workspace-server
        run: yarn install --frozen-lockfile

      - name: Compile Workspace Service
        working-directory: workspace-server
        run: yarn compile

      - name: Test Workspace Service
        working-directory: workspace-server
        run: yarn test

      - name: Verify repository hygiene
        run: |
          echo "Repository status after validation:"
          git status --short
          git diff --exit-code
          if git status --porcelain --untracked-files=all | grep -E '\.(db|db-wal|db-shm|db-journal)$'; then
            echo "Unexpected persistence artifact found"
            exit 1
          fi

      - name: Remove temporary RUN 004 validation workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/run004-validation.yml
          git add .github/workflows/run004-validation.yml
          git commit -m "chore(validation): finalize RUN 004 validation"
          git push origin HEAD:feature/workspace-run-004
