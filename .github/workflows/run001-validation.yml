name: RUN 001 validation completion

on:
  push:
    branches:
      - feature/workspace-run-001

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          ref: feature/workspace-run-001
          fetch-depth: 0

      - name: Configure Node and Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Report runtime versions
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          echo "Node: $(node --version)"
          echo "Yarn: $(yarn --version)"

      - name: Install root dependencies
        run: yarn install --frozen-lockfile

      - name: Compile existing Carder
        run: yarn compile

      - name: Build existing Carder
        run: yarn build

      - name: Install Workspace Service dependencies
        working-directory: workspace-server
        run: yarn install

      - name: Compile Workspace Service
        working-directory: workspace-server
        run: yarn compile

      - name: Test Workspace Service
        working-directory: workspace-server
        run: yarn test

      - name: Upload generated Workspace lockfile
        uses: actions/upload-artifact@v4
        with:
          name: workspace-server-yarn-lock
          path: workspace-server/yarn.lock
          if-no-files-found: error

      - name: Verify validation changed only the Workspace lockfile
        run: |
          test -f workspace-server/yarn.lock
          echo "Repository status after validation:"
          git status --short
          unexpected="$(git status --porcelain --untracked-files=all | grep -vE '^\?\? workspace-server/yarn.lock$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected repository changes detected:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit reproducible Workspace dependency graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/run001-validation.yml
          git add workspace-server/yarn.lock .github/workflows/run001-validation.yml
          git commit -m "chore(workspace): lock RUN 001 service dependencies"
          git push origin HEAD:feature/workspace-run-001
