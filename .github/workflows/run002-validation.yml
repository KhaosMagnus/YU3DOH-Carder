name: RUN 002 validation

on:
  push:
    branches:
      - feature/workspace-run-002

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout RUN 002
        uses: actions/checkout@v4
        with:
          ref: feature/workspace-run-002
          fetch-depth: 0

      - name: Configure Node and Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Report runtime versions
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          echo "Node: $(node --version)"
          echo "Yarn: $(yarn --version)"

      - name: Install root dependencies
        run: yarn install --frozen-lockfile

      - name: Compile existing Carder
        run: yarn compile

      - name: Build existing Carder
        run: yarn build

      - name: Update Workspace Service lockfile
        working-directory: workspace-server
        run: yarn install

      - name: Report resolved Workspace dependency versions
        working-directory: workspace-server
        run: |
          node -e "console.log('better-sqlite3:', require('./node_modules/better-sqlite3/package.json').version)"
          node -e "console.log('fastify:', require('./node_modules/fastify/package.json').version)"

      - name: Reinstall Workspace Service from frozen lockfile
        working-directory: workspace-server
        run: |
          rm -rf node_modules
          yarn install --frozen-lockfile

      - name: Compile Workspace Service
        working-directory: workspace-server
        run: yarn compile

      - name: Test Workspace Service
        working-directory: workspace-server
        run: yarn test

      - name: Upload updated Workspace lockfile
        uses: actions/upload-artifact@v4
        with:
          name: workspace-server-yarn-lock-run002
          path: workspace-server/yarn.lock
          if-no-files-found: error

      - name: Verify validation changed only Workspace lockfile
        run: |
          echo "Repository status after validation:"
          git status --short
          changed="$(git status --porcelain --untracked-files=all | grep -vE '^ M workspace-server/yarn.lock$' || true)"
          if [ -n "$changed" ]; then
            echo "Unexpected repository changes detected:"
            echo "$changed"
            exit 1
          fi
          git diff --exit-code -- . ':!workspace-server/yarn.lock'

      - name: Commit reproducible RUN 002 dependency graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/run002-validation.yml
          git add workspace-server/yarn.lock .github/workflows/run002-validation.yml
          git commit -m "chore(workspace): lock RUN 002 SQLite dependencies"
          git push origin HEAD:feature/workspace-run-002
