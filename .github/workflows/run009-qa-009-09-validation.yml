name: RUN 009 QA-009-09 validation

on:
  push:
    branches:
      - feature/workspace-run-009
    paths:
      - .github/workflows/run009-qa-009-09-validation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout exact functional SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Configure Node and Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Report runtime versions and functional SHA
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          echo "Functional SHA: ${{ github.sha }}"
          echo "OS: $RUNNER_OS / $(uname -a)"
          echo "Node: $(node --version)"
          echo "Yarn: $(yarn --version)"

      - name: Verify linear ancestry from QA-009-09 return and integration baseline
        run: |
          git merge-base --is-ancestor c40ffd12d0c84ed9c2eaef6b2e3e4a12e847257b HEAD
          git merge-base --is-ancestor e54800629e46f8fccd653b0bef637dd71e9b97a3 HEAD
          test -z "$(git rev-list --merges c40ffd12d0c84ed9c2eaef6b2e3e4a12e847257b..HEAD)"

      - name: Verify migrations 001 through 004 immutable and schema 4
        run: |
          test "$(git hash-object workspace-server/migrations/001_repository_foundation.sql)" = "146b395716c51b0a8a8861876e4df2d47a05fd4d"
          test "$(git hash-object workspace-server/migrations/002_canonical_domain.sql)" = "253fe76054ce3f40d50d09ecd3e90bb1b322deea"
          test "$(git hash-object workspace-server/migrations/003_art_variants_asset_index.sql)" = "7f1aa54649a4b4b73871a50177de492047fe4f83"
          test "$(git hash-object workspace-server/migrations/004_managed_asset_ingest.sql)" = "2f2f58239d597d34d5608fcf022b9d2f4007da91"
          test -z "$(ls workspace-server/migrations/005_* 2>/dev/null)"
          grep -q "SUPPORTED_DATABASE_SCHEMA_VERSION = 4;" workspace-server/src/persistence/constants.ts

      - name: Verify dependency state unchanged from QA candidate
        run: |
          git diff --exit-code c40ffd12d0c84ed9c2eaef6b2e3e4a12e847257b -- yarn.lock workspace-server/yarn.lock
          git diff --exit-code c40ffd12d0c84ed9c2eaef6b2e3e4a12e847257b -- package.json workspace-server/package.json

      - name: Verify QA-009-09 protected-source wiring
        run: |
          grep -q "isWorkspaceCarderAssetUrl" src/model/image.ts
          grep -q "WORKSPACE_FAIL_CLOSED" src/model/image.ts
          grep -q "resolveOnlineImageErrorRecovery" src/component/image-cropper/image-cropper.tsx
          grep -q "Workspace asset unavailable" src/component/image-cropper/image-cropper.tsx
          if grep -q "toProxiedUrl(externalSource)" src/component/image-cropper/image-cropper.tsx; then exit 1; fi
          if grep -q "extra: { externalSource }" src/component/image-cropper/image-cropper.tsx; then exit 1; fi

      - name: Install root dependencies frozen
        run: yarn install --frozen-lockfile

      - name: Compile Carder and Library client
        run: yarn compile

      - name: Validate Library client and Workspace bridge contracts
        run: |
          yarn test:library 2>&1 | tee "$RUNNER_TEMP/client-test.log"
          test "${PIPESTATUS[0]}" -eq 0
          grep -q "workspace-bridge adapter/client checks passed: 55" "$RUNNER_TEMP/client-test.log"
          grep -q "QA-009-09-01" scripts/test-workspace-bridge.ts
          grep -q "QA-009-09-05" scripts/test-workspace-bridge.ts

      - name: Build Carder and Library production entries
        run: yarn build

      - name: Verify production entry outputs and /ygocarder/ base
        run: |
          test -f dist/index.html
          test -f dist/library/index.html
          grep -q "YU3DOH Library" dist/library/index.html
          grep -q 'src="/ygocarder/assets/carder-' dist/index.html
          grep -q 'src="/ygocarder/assets/library-' dist/library/index.html
          grep -l 'ws_card_id' dist/assets/*.js | xargs grep -l '`/ygocarder/`'

      - name: Install Workspace Service frozen
        working-directory: workspace-server
        run: yarn install --frozen-lockfile

      - name: Compile Workspace Service
        working-directory: workspace-server
        run: yarn compile

      - name: Test Workspace Service including Carder prepare (B-01..B-14, G-01..G-15)
        working-directory: workspace-server
        run: |
          yarn test 2>&1 | tee "$RUNNER_TEMP/ws-test.log"
          test "${PIPESTATUS[0]}" -eq 0
          grep -E "^# (tests|pass|fail|skipped)" "$RUNNER_TEMP/ws-test.log"
          grep -q "^# tests 226$" "$RUNNER_TEMP/ws-test.log"
          grep -q "^# pass 226$" "$RUNNER_TEMP/ws-test.log"
          grep -q "^# fail 0$" "$RUNNER_TEMP/ws-test.log"
          grep -q "^# skipped 0$" "$RUNNER_TEMP/ws-test.log"
          grep -q "B-10 junction executed on platform=win32" "$RUNNER_TEMP/ws-test.log"
          grep -E "^ok [0-9]+ - B-10 " "$RUNNER_TEMP/ws-test.log" | grep -v SKIP
          test "$(grep -E '^ok [0-9]+ - G-(0[1-9]|1[0-5]) ' "$RUNNER_TEMP/ws-test.log" | grep -vc SKIP)" -eq 15

      - name: Verify repository hygiene
        run: |
          git status --short
          git diff --exit-code
          if git status --porcelain --untracked-files=all | grep -E '\.(db|db-wal|db-shm|db-journal)$'; then
            exit 1
          fi

      - name: Remove temporary RUN 009 QA-009-09 validation workflow
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/run009-qa-009-09-validation.yml
          git commit -m "chore(validation): finalize RUN 009 QA-009-09 validation"
          git push origin HEAD:refs/heads/feature/workspace-run-009
